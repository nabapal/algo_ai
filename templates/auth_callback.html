<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FYERS authorization</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
      background: #f2f2f2; color: #101828; font: 16px system-ui, sans-serif; }
    main { width: min(100%, 520px); padding: 28px; border-radius: 14px; background: white; text-align: center; }
    h1 { font-size: 22px; }
    a { color: #2f5fdb; }
  </style>
</head>
<body>
  <main>
    <h1>{{ 'Authorization complete' if success else 'Authorization not completed' }}</h1>
    <p>{{ message }}</p>
    <a href="/">Return to dashboard</a>
  </main>
  {% if success %}<script>
    history.replaceState({}, document.title, location.pathname);
    if (window.opener) {
      window.opener.location.href = "/";
      window.close();
    }
  </script>{% endif %}
</body>
</html>
